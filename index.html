<script>
var D=[{"q":"Какую информацию он нашёл?","qv":"Anh ấy đã tìm được thông tin gì?","a":"Информацию о вундеркинде.","av":"Thông tin về một thần đồng.","t":"Ты уже нашел в интернете что-нибудь интересное? На одном сайте я нашел информацию о вундеркинде.","tv":"Cậu đã tìm được điều gì thú vị trên Internet chưa? Trên một trang web, tớ đã tìm được thông tin về một thần đồng.","s":1,"n":1},{"q":"Что его интересует?","qv":"Anh ấy quan tâm đến điều gì?","a":"История России и пушкинские места.","av":"Lịch sử Nga và những nơi gắn với Pushkin.","t":"А что вас интересует? Меня интересует история России. И ещё я хотел бы побывать в местах, где жил Пушкин.","tv":"Ông quan tâm đến điều gì? Tôi quan tâm đến lịch sử Nga. Tôi còn muốn đến những nơi Pushkin từng sống.","s":1,"n":2},{"q":"На какой части России находится санаторий?","qv":"Khu điều dưỡng nằm ở vùng nào của Nga?","a":"На юге России.","av":"Ở miền Nam nước Nga.","t":"Добро пожаловать на юг России! Наш санаторий находится на берегу Черного моря.","tv":"Chào mừng đến miền Nam nước Nga! Khu điều dưỡng của chúng tôi nằm bên bờ Biển Đen.","s":1,"n":3},{"q":"Кто такой Александр Бородин?","qv":"Aleksandr Borodin là ai?","a":"Композитор и учёный-химик.","av":"Nhà soạn nhạc và nhà hóa học.","t":"Многие люди знают имя русского композитора Александра Бородина, но не все знают, что он был не только известным композитором, но и учёным-химиком.","tv":"Nhiều người biết tên nhà soạn nhạc Nga Aleksandr Borodin, nhưng không phải ai cũng biết ông không chỉ là một nhà soạn nhạc nổi tiếng mà còn là một nhà hóa học.","s":1,"n":4},{"q":"Какое средство заняло первое место до телевидения?","qv":"Phương tiện nào đứng đầu trước truyền hình?","a":"Печать — газеты и журналы.","av":"Báo chí — báo và tạp chí.","t":"Сегодня телевидение в нашей жизни заняло первое место. А раньше первое место было у печати, у газет и журналов.","tv":"Ngày nay, truyền hình đã chiếm vị trí đầu tiên trong cuộc sống của chúng ta. Trước đây, vị trí đầu tiên thuộc về báo chí, tức báo và tạp chí.","s":1,"n":5},{"q":"Где учатся Карлос и Лена?","qv":"Carlos và Lena học ở đâu?","a":"В Петербургском университете.","av":"Ở Đại học Sankt Petersburg.","t":"Меня зовут Карлос. Я колумбиец. У меня есть подруга. Её зовут Лена. Мы вместе учимся в одной группе в Петербургском университете.","tv":"Tôi tên là Carlos. Tôi là người Colombia. Tôi có một người bạn gái tên là Lena. Chúng tôi cùng học một nhóm ở Đại học Sankt Petersburg.","s":1,"n":6},{"q":"Где висит семейный портрет?","qv":"Bức chân dung gia đình được treo ở đâu?","a":"На стене в гостиной.","av":"Trên tường trong phòng khách.","t":"У нас дома есть семейный портрет. Он висит на стене в гостиной.","tv":"Ở nhà chúng tôi có một bức chân dung gia đình. Bức tranh được treo trên tường trong phòng khách.","s":1,"n":7},{"q":"На какой площади расположен магазин ГУМ?","qv":"Cửa hàng GUM nằm ở quảng trường nào?","a":"На Красной площади.","av":"Ở Quảng trường Đỏ.","t":"Магазин ГУМ, который находится на Красной площади за мной.","tv":"Cửa hàng GUM nằm ở Quảng trường Đỏ, phía sau tôi.","s":1,"n":8},{"q":"В каком году родился Вольфганг Амадей Моцарт?","qv":"Wolfgang Amadeus Mozart sinh năm nào?","a":"В 1756 году.","av":"Năm 1756.","t":"В 1756 году в городе Зальцбург родился известный композитор Вольфганг Амадей Моцарт.","tv":"Năm 1756, nhà soạn nhạc nổi tiếng Wolfgang Amadeus Mozart ra đời tại thành phố Salzburg.","s":1,"n":9},{"q":"Когда родился Сергей Васильевич Рахманинов?","qv":"Sergei Vasilyevich Rachmaninov sinh khi nào?","a":"1 апреля 1873 года.","av":"Ngày 1 tháng 4 năm 1873.","t":"Сергей Васильевич Рахманинов – великий русский композитор, пианист и дирижер. Родился 1 апреля 1873 года в маленькой деревне, недалеко от Новгорода.","tv":"Sergei Vasilyevich Rachmaninov, nhà soạn nhạc, nghệ sĩ piano và nhạc trưởng vĩ đại của Nga, sinh ngày 1 tháng 4 năm 1873 tại một ngôi làng nhỏ gần Novgorod.","s":1,"n":10},{"q":"Где она родилась?","qv":"Cô ấy sinh ra ở đâu?","a":"В маленьком городе в Англии.","av":"Trong một thành phố nhỏ ở Anh.","t":"Она родилась в 1965 году в маленьком городе в Англии.","tv":"Cô ấy sinh năm 1965 tại một thành phố nhỏ ở Anh.","s":1,"n":11},{"q":"Сколько человек живёт в Москве?","qv":"Có bao nhiêu người sống ở Moskva?","a":"12 миллионов человек.","av":"12 triệu người.","t":"В Москве живет 12 миллионов человек.","tv":"Có 12 triệu người sống ở Moskva.","s":1,"n":12},{"q":"Где живёт Кирилл? Когда автор навестил Кирилла?","qv":"Kirill sống ở đâu? Tác giả đến thăm Kirill khi nào?","a":"Во Вьетнаме. Прошлым летом.","av":"Ở Việt Nam. Vào mùa hè năm ngoái.","t":"Мой друг Кирилл уже несколько лет живет во Вьетнаме, и прошлым летом я поехал его навестить.","tv":"Bạn tôi, Kirill, đã sống ở Việt Nam được vài năm. Mùa hè năm ngoái tôi đến thăm anh ấy.","s":1,"n":13},{"q":"Куда они ездили 3 года назад?","qv":"Ba năm trước họ đã đi đâu?","a":"В Исландию.","av":"Đến Iceland.","t":"3 года назад в июне мы с подругой поехали в Исландию.","tv":"Ba năm trước, vào tháng Sáu, tôi và bạn gái đến Iceland.","s":1,"n":14},{"q":"Когда они ездили в Амстердам?","qv":"Họ đã đến Amsterdam khi nào?","a":"На выходные, когда были студентами.","av":"Vào cuối tuần, khi còn là sinh viên.","t":"Когда мы с Беном были студентами, мы поехали на выходные в Амстердам.","tv":"Khi tôi và Ben còn là sinh viên, chúng tôi đã đến Amsterdam vào cuối tuần.","s":1,"n":15},{"q":"Где Арнольд и Франческа познакомились?","qv":"Arnold và Francesca quen nhau ở đâu?","a":"В Италии.","av":"Ở Ý.","t":"Арнольд и Франческа познакомились в Италии.","tv":"Arnold và Francesca quen nhau ở Ý.","s":1,"n":16},{"q":"Как его зовут? Сколько ему лет? Где он живёт?","qv":"Cậu ấy tên gì? Bao nhiêu tuổi? Sống ở đâu?","a":"Эрнесто Евгений, 11 лет, живёт на Алтае, в России.","av":"Ernesto Evgeny, 11 tuổi, sống ở Altai, Nga.","t":"А как его зовут? Сколько ему лет? Ему 11 лет. Он живет в России, на Алтае. Его зовут Эрнесто Евгений.","tv":"Cậu ấy tên gì? Bao nhiêu tuổi? Cậu ấy 11 tuổi, sống ở Altai thuộc Nga. Cậu ấy tên là Ernesto Evgeny.","s":1,"n":17},{"q":"Где находятся Пушкинские места?","qv":"Những địa danh gắn với Pushkin nằm ở đâu?","a":"Недалеко от Пскова.","av":"Gần Pskov.","t":"Тогда могу предложить вам экскурсию в старинные русские города Псков и Великий Новгород. А недалеко от Пскова находятся Пушкинские места.","tv":"Vậy tôi có thể giới thiệu cho ông chuyến tham quan các thành phố cổ của Nga là Pskov và Veliky Novgorod. Những địa danh gắn với Pushkin nằm gần Pskov.","s":1,"n":18},{"q":"Что есть в номерах?","qv":"Trong các phòng có những gì?","a":"Душ, туалет, телефон, телевизор, холодильник и мини-бар.","av":"Vòi sen, nhà vệ sinh, điện thoại, tivi, tủ lạnh và minibar.","t":"Вы будете жить в комфортабельных номерах с видом на море. Во всех номерах есть душ, туалет, телефон, телевизор, холодильник и мини-бар.","tv":"Quý khách sẽ ở trong những phòng tiện nghi nhìn ra biển. Tất cả các phòng đều có vòi sen, nhà vệ sinh, điện thoại, tivi, tủ lạnh và minibar.","s":1,"n":19},{"q":"Где он родился? В какой семье?","qv":"Ông ấy sinh ra ở đâu? Trong gia đình như thế nào?","a":"В Санкт-Петербурге, в богатой дворянской семье.","av":"Ở Sankt Petersburg, trong một gia đình quý tộc giàu có.","t":"Бородин родился в Санкт-Петербурге в богатой дворянской семье.","tv":"Borodin sinh ra ở Sankt Petersburg, trong một gia đình quý tộc giàu có.","s":1,"n":20},{"q":"Все россияне любят смотреть телевидение?","qv":"Có phải tất cả người Nga đều thích xem truyền hình không?","a":"Нет, не все.","av":"Không, không phải tất cả.","t":"Интересно, что не все россияне любят телевидение. Многим оно не нравится, но 85 человек из 100 смотрят телевизор ежедневно и несколько часов.","tv":"Điều thú vị là không phải tất cả người Nga đều thích truyền hình. Nhiều người không thích nó, nhưng 85 trong số 100 người vẫn xem tivi hằng ngày, mỗi ngày vài giờ.","s":1,"n":21},{"q":"Кем они хотят стать?","qv":"Họ muốn trở thành ai, làm nghề gì?","a":"Лена — фоторепортёром, Карлос — журналистом.","av":"Lena muốn làm phóng viên ảnh, Carlos muốn làm nhà báo.","t":"Лена хочет стать фоторепортёром, а я – журналистом.","tv":"Lena muốn trở thành phóng viên ảnh, còn tôi muốn trở thành nhà báo.","s":1,"n":22},{"q":"Сколько времени рисовал старший брат?","qv":"Anh trai đã vẽ trong bao lâu?","a":"Целый год.","av":"Suốt một năm.","t":"Дело в том, что мой старший брат – художник. Он рисовал этот портрет целый год.","tv":"Anh trai tôi là họa sĩ. Anh ấy đã vẽ bức chân dung này suốt một năm.","s":1,"n":23},{"q":"В каком веке построили этот магазин?","qv":"Cửa hàng này được xây dựng vào thế kỷ nào?","a":"В конце XIX века.","av":"Cuối thế kỷ XIX.","t":"Магазин не очень старый, ему немного больше 100 лет. Его построили в конце XIX века.","tv":"Cửa hàng không quá cổ, chỉ hơn 100 năm tuổi một chút. Nó được xây dựng vào cuối thế kỷ XIX.","s":1,"n":24},{"q":"Где он учился?","qv":"Cậu ấy học ở đâu?","a":"Дома.","av":"Ở nhà.","t":"Маленький Моцарт не ходил в школу, он учился дома.","tv":"Mozart lúc nhỏ không đi học ở trường. Cậu học ở nhà.","s":1,"n":25},{"q":"Чем он интересовался? Кто был его первой учительницей?","qv":"Ông ấy quan tâm đến điều gì? Ai là cô giáo đầu tiên của ông ấy?","a":"Музыкой. Его мама.","av":"Âm nhạc. Mẹ của ông ấy.","t":"Рахманинов рано начал интересоваться музыкой. Его первой учительницей была мама.","tv":"Rachmaninov bắt đầu quan tâm đến âm nhạc từ sớm. Cô giáo đầu tiên của ông là mẹ.","s":1,"n":26},{"q":"Что она любила делать в детстве?","qv":"Hồi nhỏ cô ấy thích làm gì?","a":"Рассказывать истории и писать сказки.","av":"Kể chuyện và viết truyện cổ tích.","t":"В детстве она была тихой неспортивной девочкой. Любила рассказывать истории и писать сказки.","tv":"Hồi nhỏ, cô ấy là một cô bé trầm tính, không thích thể thao. Cô thích kể chuyện và viết truyện cổ tích.","s":1,"n":27},{"q":"Какие проблемы есть на дорогах в Москве?","qv":"Đường sá ở Moskva có những vấn đề gì?","a":"Большие пробки утром и вечером.","av":"Ùn tắc lớn vào buổi sáng và buổi tối.","t":"Утром и вечером на улицах города большие пробки.","tv":"Buổi sáng và buổi tối, các đường phố trong thành phố có những đợt ùn tắc lớn.","s":1,"n":28},{"q":"Зачем они решили пойти в горную деревушку?","qv":"Vì sao họ quyết định đến ngôi làng nhỏ miền núi?","a":"Чтобы погулять.","av":"Để đi dạo.","t":"Однажды мы с Кириллом решили пойти в горную деревушку на прогулку.","tv":"Một lần, tôi và Kirill quyết định đến một ngôi làng nhỏ miền núi để đi dạo.","s":1,"n":29},{"q":"Что они хотели увидеть?","qv":"Họ muốn nhìn thấy những gì?","a":"Водопады, гейзеры и вулканы.","av":"Thác nước, mạch nước phun và núi lửa.","t":"Мы мечтали увидеть красивые водопады, гейзеры и вулканы.","tv":"Chúng tôi mơ được nhìn thấy những thác nước đẹp, những mạch nước phun và núi lửa.","s":1,"n":30},{"q":"В каком хостеле они были?","qv":"Họ đã ở nhà trọ như thế nào?","a":"В дешёвом хостеле.","av":"Ở một nhà trọ giá rẻ.","t":"Мы остановились в дешевом хостеле, чтобы сэкономить.","tv":"Chúng tôi ở một nhà trọ giá rẻ để tiết kiệm tiền.","s":1,"n":31},{"q":"Кто они по национальности?","qv":"Họ mang quốc tịch gì?","a":"Арнольд — австриец, Франческа — итальянка.","av":"Arnold là người Áo, Francesca là người Ý.","t":"Арнольд — австриец, который приехал в отпуск в Италию. А Франческа — итальянка.","tv":"Arnold là người Áo đến Ý nghỉ phép, còn Francesca là người Ý.","s":1,"n":32},{"q":"Где родились его родители?","qv":"Bố mẹ cậu ấy sinh ra ở đâu?","a":"Отец — на Кубе, мама — в России.","av":"Bố ở Cuba, mẹ ở Nga.","t":"Родина его отца Куба. Мама из России.","tv":"Quê hương của bố cậu ấy là Cuba. Mẹ cậu ấy là người đến từ Nga.","s":1,"n":33},{"q":"Когда начинается и кончается экскурсия?","qv":"Chuyến tham quan bắt đầu và kết thúc khi nào?","a":"С четверга вечера до понедельника утра.","av":"Từ tối thứ Năm đến sáng thứ Hai.","t":"Сколько дней продолжается экскурсия? Три дня. Выезжаете из Москвы в четверг вечером, а в понедельник утром возвращаетесь.","tv":"Chuyến tham quan kéo dài bao nhiêu ngày? Ba ngày. Quý khách rời Moskva vào tối thứ Năm và trở về vào sáng thứ Hai.","s":1,"n":34},{"q":"Какое расстояние от санатория до пляжа моря?","qv":"Từ khu điều dưỡng đến bãi biển cách bao xa?","a":"100 метров.","av":"100 mét.","t":"Санаторий находится в 100 метрах от моря.","tv":"Khu điều dưỡng cách biển 100 mét.","s":1,"n":35},{"q":"Во сколько лет он начал учиться в гимназии?","qv":"Ông ấy bắt đầu học trường trung học gymnasium lúc mấy tuổi?","a":"В шесть лет.","av":"Lúc sáu tuổi.","t":"Когда Александру было 6 лет, он начал учиться в гимназии.","tv":"Khi Aleksandr sáu tuổi, ông bắt đầu học ở trường trung học gymnasium.","s":1,"n":36},{"q":"Когда смотрят телевизор жители города?","qv":"Người dân thành phố xem tivi khi nào?","a":"Утром до работы, за ужином; некоторые — весь день.","av":"Buổi sáng trước khi đi làm, trong bữa tối; một số người xem cả ngày.","t":"Более половины жителей города смотрят телевизор до работы утром. 50 человек из 100 смотрят телевизор во время ужина, а 30 человек из 100 смотрят телевизор весь день.","tv":"Hơn một nửa cư dân thành phố xem tivi vào buổi sáng trước khi đi làm. Cứ 100 người thì có 50 người xem trong bữa tối, còn 30 người xem tivi cả ngày.","s":1,"n":37},{"q":"Что они любят делать?","qv":"Họ thích làm gì?","a":"Лена — фотографировать, ходить в музеи и театры; Карлос — рисовать и собирать марки.","av":"Lena thích chụp ảnh, đi bảo tàng và nhà hát; Carlos thích vẽ và sưu tầm tem.","t":"Она очень любит фотографировать, ходить в музеи и театры. А я люблю рисовать и собираю марки.","tv":"Cô ấy rất thích chụp ảnh, đi bảo tàng và nhà hát. Còn tôi thích vẽ và sưu tầm tem.","s":1,"n":38},{"q":"Каков портрет отца в рассказе автора?","qv":"Người cha được tác giả miêu tả như thế nào?","a":"Пожилой, привлекательный, высокий и стройный, с бородой и в очках.","av":"Lớn tuổi, hấp dẫn, cao và thon, có râu và đeo kính.","t":"В центре картины вы видите нашего папу, его зовут Иван. Папа уже пожилой, но очень привлекательный мужчина. Он работает преподавателем в университете. Папа высокий и стройный. Как видите, он носит бороду и очки. Кажется, что в очках он очень серьезный, но обычно папа часто смеется и любит шутить.","tv":"Ở giữa bức tranh, các bạn thấy bố chúng tôi. Bố tên là Ivan. Bố đã lớn tuổi nhưng rất hấp dẫn. Bố làm giảng viên đại học. Bố cao và thon. Như các bạn thấy, bố để râu và đeo kính. Khi đeo kính, bố trông rất nghiêm túc. Nhưng thường thì bố hay cười và thích nói đùa.","s":1,"n":39},{"q":"Где находится фонтан?","qv":"Đài phun nước nằm ở đâu?","a":"В центре ГУМа.","av":"Ở trung tâm GUM.","t":"В центре ГУМа находится фонтан.","tv":"Đài phun nước nằm ở trung tâm GUM.","s":1,"n":40},{"q":"Что особенное в этом мальчике?","qv":"Cậu bé này có điều gì đặc biệt?","a":"В четыре года написал концерт, в семь — симфонию, в двенадцать — оперу.","av":"Bốn tuổi viết concerto, bảy tuổi viết giao hưởng, mười hai tuổi viết opera.","t":"Талантливый мальчик написал свой первый концерт, когда ему было четыре года. В семь лет он написал первую симфонию, а в двенадцать лет оперу.","tv":"Cậu bé tài năng đã viết bản concerto đầu tiên khi mới bốn tuổi. Bảy tuổi cậu viết bản giao hưởng đầu tiên, còn mười hai tuổi viết opera.","s":1,"n":41},{"q":"Сколько ему было лет, когда он поступил в Санкт-Петербургскую консерваторию?","qv":"Ông ấy bao nhiêu tuổi khi vào Nhạc viện Sankt Petersburg?","a":"Девять лет.","av":"Chín tuổi.","t":"А в 9 лет поступил в Санкт-Петербургскую консерваторию.","tv":"Lúc chín tuổi, ông vào Nhạc viện Sankt Petersburg.","s":1,"n":42},{"q":"Какой язык она любила?","qv":"Cô ấy yêu thích ngôn ngữ nào?","a":"Английский язык.","av":"Tiếng Anh.","t":"В школе девочка любила английский и интересовалась иностранными языками.","tv":"Ở trường, cô bé thích tiếng Anh và quan tâm đến các ngoại ngữ.","s":1,"n":43},{"q":"На чём москвичи любят ездить?","qv":"Người Moskva thích đi bằng phương tiện gì?","a":"На метро.","av":"Bằng metro.","t":"И многие жители Москвы предпочитают ездить на метро.","tv":"Nhiều cư dân Moskva thích đi bằng metro hơn.","s":1,"n":44},{"q":"Что они купили в магазине?","qv":"Họ đã mua gì trong cửa hàng?","a":"Воду и печенье.","av":"Nước và bánh quy.","t":"Рано утром мы выехали из дома и по пути заехали в магазин, чтобы купить воду и печенье.","tv":"Sáng sớm, chúng tôi rời nhà và ghé vào cửa hàng trên đường để mua nước và bánh quy.","s":1,"n":45},{"q":"Какая погода была в Рейкьявике?","qv":"Thời tiết ở Reykjavik lúc đó như thế nào?","a":"Дул ветер и шёл дождь.","av":"Có gió và mưa.","t":"Во-вторых, была плохая погода. Дул ветер и шел дождь.","tv":"Thứ hai, thời tiết rất xấu. Trời có gió và mưa.","s":1,"n":46},{"q":"Почему они были в шоке?","qv":"Vì sao họ bị sốc?","a":"Комната была грязная и холодная, соседи — шумные.","av":"Phòng bẩn và lạnh, hàng xóm ồn ào.","t":"Когда мы приехали в хостел, мы были в шоке. Комната была очень грязная и холодная, а соседи шумные.","tv":"Khi đến nhà trọ, chúng tôi bị sốc. Phòng rất bẩn và lạnh, còn những người ở cạnh thì ồn ào.","s":1,"n":47},{"q":"Какая любовь у них?","qv":"Tình yêu của họ là tình yêu như thế nào?","a":"Любовь с первого взгляда.","av":"Tình yêu từ cái nhìn đầu tiên.","t":"Это была любовь с первого взгляда.","tv":"Đó là tình yêu từ cái nhìn đầu tiên.","s":1,"n":48},{"q":"Что изобрёл этот мальчик?","qv":"Cậu bé này đã phát minh ra gì?","a":"Холодильник без электричества и необычный телевизор.","av":"Tủ lạnh không cần điện và một chiếc tivi đặc biệt.","t":"Но что же удивительного в этом мальчике? Он изобрел холодильник, которому не нужно электричество. И еще он придумал необычный телевизор. У него есть и другие изобретения.","tv":"Cậu bé này có gì đáng ngạc nhiên? Cậu đã phát minh ra tủ lạnh không cần điện. Cậu còn nghĩ ra một chiếc tivi đặc biệt và có những phát minh khác nữa.","s":1,"n":49},{"q":"Какие достопримечательности он увидит во время экскурсии?","qv":"Anh ấy sẽ thấy những danh thắng nào trong chuyến tham quan?","a":"Псковский и Новгородский кремли, Михайловское, Святогорский монастырь, древний собор и памятник тысячелетию России.","av":"Hai điện Kremlin Pskov và Novgorod, Mikhailovskoye, tu viện Svyatogorsky, nhà thờ cổ và tượng đài Một nghìn năm nước Nga.","t":"А какая программа экскурсии? В первый день вы побываете в Пскове. Посмотрите знаменитый Псковский Кремль. А потом? На следующий день вы поедете в Михайловское, где жил Пушкин. Побываете в Святогорском монастыре. Прекрасно! Экскурсия заканчивается в Великом Новгороде. Там вы посетите Новгородский Кремль. Увидите самый древний российский собор. И памятник тысячелетию России.","tv":"Chương trình tham quan như thế nào? Ngày đầu, quý khách đến Pskov và xem điện Kremlin Pskov nổi tiếng. Sau đó thì sao? Ngày tiếp theo, quý khách đến Mikhailovskoye, nơi Pushkin từng sống, và tham quan tu viện Svyatogorsky. Tuyệt quá! Chuyến tham quan kết thúc ở Veliky Novgorod. Tại đó, quý khách tham quan điện Kremlin Novgorod, chiêm ngưỡng nhà thờ cổ nhất nước Nga và tượng đài Một nghìn năm nước Nga.","s":1,"n":50},{"q":"Что вы можете делать в первой половине дня?","qv":"Bạn có thể làm gì trong nửa đầu của ngày?","a":"Загорать и плавать в море и бассейнах.","av":"Tắm nắng, bơi ở biển và bể bơi.","t":"В первой половине дня вы можете загорать на шикарных морских пляжах, плавать в теплом море и в наших чистых бассейнах, которые находятся на территории санатория.","tv":"Trong nửa đầu của ngày, quý khách có thể tắm nắng trên những bãi biển tuyệt đẹp, bơi trong làn nước biển ấm và trong các bể bơi sạch nằm trong khuôn viên khu điều dưỡng.","s":1,"n":51},{"q":"Какие предметы он изучал в гимназии?","qv":"Ông ấy đã học những môn nào ở trường trung học gymnasium?","a":"Химию, физику, математику и биологию.","av":"Hóa học, vật lý, toán và sinh học.","t":"Уже в гимназии Александр начал серьезно заниматься химией, физикой, математикой, биологией.","tv":"Ngay từ khi học ở trường trung học gymnasium, Aleksandr đã bắt đầu nghiên cứu nghiêm túc hóa học, vật lý, toán và sinh học.","s":1,"n":52},{"q":"Почему россияне предпочитают телевидение печати?","qv":"Vì sao người Nga thích truyền hình hơn báo chí?","a":"Телевидение почти бесплатное, а печать дорогая.","av":"Truyền hình gần như miễn phí, còn báo chí đắt.","t":"Да потому что телевизор можно смотреть почти бесплатно. Электричество стоит очень дешево, а газеты и журналы дорого.","tv":"Bởi vì có thể xem tivi gần như miễn phí. Điện rất rẻ, còn báo và tạp chí thì đắt.","s":1,"n":53},{"q":"Что они часто вместе делают в свободное время?","qv":"Họ thường cùng nhau làm gì lúc rảnh?","a":"Ходят в музеи и театры, осматривают город, гуляют.","av":"Đi bảo tàng và nhà hát, tham quan thành phố, đi dạo.","t":"Меня очень интересуют города мира. Я собрал уже 50 марок. В свободное время мы с Леной часто ходим в музеи и театры, осматриваем достопримечательности города или просто гуляем по городу.","tv":"Tôi rất quan tâm đến các thành phố trên thế giới. Tôi đã sưu tầm được 50 con tem. Lúc rảnh, tôi và Lena thường cùng đi bảo tàng, nhà hát, tham quan các danh thắng trong thành phố hoặc đơn giản là đi dạo phố.","s":1,"n":54},{"q":"Как выглядит его мать?","qv":"Mẹ của người kể chuyện có ngoại hình như thế nào?","a":"Короткие светлые волосы, голубые глаза, немного полная.","av":"Tóc ngắn sáng màu, mắt xanh da trời, hơi đầy đặn.","t":"Рядом с папой стоит наша мама. Её зовут Валентина. У неё короткие светлые волосы и голубые глаза. Мама немного полная. Она старается заботиться о фигуре. Но это непросто. Дело в том, что мама работает кондитером в булочной.","tv":"Bên cạnh bố là mẹ chúng tôi. Mẹ tên là Valentina. Mẹ có mái tóc ngắn sáng màu và đôi mắt xanh da trời. Mẹ hơi đầy đặn. Mẹ cố gắng giữ dáng nhưng không dễ, vì mẹ làm thợ bánh ngọt trong một tiệm bánh.","s":1,"n":55},{"q":"Зачем люди приходят в ГУМ?","qv":"Mọi người đến GUM để làm gì?","a":"Купить товары, отдохнуть и выпить кофе.","av":"Mua hàng, nghỉ ngơi và uống cà phê.","t":"Вы можете купить здесь хорошие товары, а также очень хорошо отдохнуть и, например, выпить кофе.","tv":"Các bạn có thể mua những mặt hàng tốt ở đây, đồng thời nghỉ ngơi thoải mái, chẳng hạn uống một tách cà phê.","s":1,"n":56},{"q":"Когда Моцарт познакомился с Констанцией Вебер?","qv":"Mozart quen Constanze Weber khi nào?","a":"В 1777 году.","av":"Năm 1777.","t":"В 1777 году Моцарт познакомился с Констанцией Вебер. Молодая девушка влюбилась в него с первого взгляда.","tv":"Năm 1777, Mozart quen Constanze Weber. Cô gái trẻ đã yêu ông ngay từ cái nhìn đầu tiên.","s":1,"n":57},{"q":"Когда он поступил в Московскую консерваторию?","qv":"Ông ấy vào Nhạc viện Moskva khi nào?","a":"В 1885 году.","av":"Năm 1885.","t":"В 1885 году Сергей Рахманинов переехал в Москву и поступил в Московскую консерваторию.","tv":"Năm 1885, Sergei Rachmaninov chuyển đến Moskva và vào Nhạc viện Moskva.","s":1,"n":58},{"q":"Кем она работала во время учёбы?","qv":"Trong thời gian học cô ấy làm nghề gì?","a":"Секретарём.","av":"Thư ký.","t":"Во время учебы она работала секретарем.","tv":"Trong thời gian học, cô ấy làm thư ký.","s":1,"n":59},{"q":"Сколько человек ездит на метро в день?","qv":"Mỗi ngày có bao nhiêu người đi metro?","a":"8 миллионов человек.","av":"8 triệu người.","t":"На метро ездит 8 миллионов человек в день.","tv":"Mỗi ngày có 8 triệu người đi metro.","s":1,"n":60},{"q":"Как долго они покупали в магазине?","qv":"Họ mua sắm trong cửa hàng bao lâu?","a":"Один час, с восьми до девяти утра.","av":"Một giờ, từ 8 đến 9 giờ sáng.","t":"Мы вошли в магазин в 8 часов утра, а вышли в 9 часов.","tv":"Chúng tôi vào cửa hàng lúc 8 giờ sáng và ra lúc 9 giờ.","s":1,"n":61},{"q":"В какой гостинице они были?","qv":"Họ đã ở khách sạn như thế nào?","a":"В холодном отеле без горячей воды.","av":"Trong một khách sạn lạnh và không có nước nóng.","t":"Мы остановились в отеле, в котором было холодно и не было горячей воды.","tv":"Chúng tôi ở một khách sạn lạnh và không có nước nóng.","s":1,"n":62},{"q":"Что они делали в Амстердаме?","qv":"Họ đã làm gì ở Amsterdam?","a":"Гуляли, посещали музеи, катались на лодке, ездили на экскурсию.","av":"Đi dạo, thăm bảo tàng, đi thuyền và tham quan.","t":"Мы весь день гуляли по городу, посещали музеи, катались по каналам на лодке, ездили на обзорную экскурсию.","tv":"Cả ngày chúng tôi đi dạo trong thành phố, thăm các bảo tàng, đi thuyền trên các kênh và tham gia chuyến tham quan tổng thể thành phố.","s":1,"n":63},{"q":"Почему Арнольд и Франческа подумали, что больше никогда не встретятся?","qv":"Vì sao Arnold và Francesca nghĩ rằng họ sẽ không bao giờ gặp lại nhau?","a":"Арнольд потерял телефон, и они не могли связаться.","av":"Arnold mất điện thoại nên họ không liên lạc được.","t":"Они поменялись номерами телефонов и договорились позвонить друг другу вечером. Но когда Арнольд хотел позвонить Франческе, он понял, что потерял телефон. Франческа тоже звонила ему, но никто не ответил. Они уже подумали, что больше никогда не встретятся.","tv":"Họ trao đổi số điện thoại và hẹn gọi cho nhau vào buổi tối. Nhưng khi định gọi cho Francesca, Arnold nhận ra mình đã mất điện thoại. Francesca cũng gọi cho anh nhưng không ai trả lời. Họ đã nghĩ rằng sẽ không bao giờ gặp lại nhau nữa.","s":1,"n":64},{"q":"Чем он увлекается?","qv":"Cậu ấy có những sở thích gì?","a":"Читать, рисовать, писать стихи и рассказы.","av":"Đọc sách, vẽ, làm thơ và viết truyện.","t":"Наверное, его интересуют только наука и техника. Вовсе нет. Он много читает, рисует, пишет стихи и рассказы.","tv":"Chắc cậu ấy chỉ quan tâm đến khoa học và kỹ thuật? Không hề. Cậu đọc rất nhiều, vẽ, làm thơ và viết truyện.","s":1,"n":65},{"q":"Сколько стоит эта экскурсия?","qv":"Chuyến tham quan này giá bao nhiêu?","a":"2000 рублей.","av":"2.000 rúp.","t":"Скажите, пожалуйста, сколько стоит эта поездка? Недорого. Две тысячи рублей. Извините. Две тысячи рублей за всё? И за билеты? И за гостиницу? И за экскурсии? Да. Это всё входит в стоимость тура.","tv":"Xin cho biết chuyến đi này giá bao nhiêu? Không đắt, 2.000 rúp. Xin lỗi, 2.000 rúp cho tất cả sao? Cả vé, khách sạn và các chuyến tham quan? Đúng vậy, tất cả đều nằm trong giá tour.","s":1,"n":66},{"q":"Что вы можете купить в недорогих магазинах городка?","qv":"Bạn có thể mua gì trong những cửa hàng giá rẻ của thị trấn?","a":"Красивые сувениры.","av":"Những món quà lưu niệm đẹp.","t":"В недорогих магазинах нашего городка вы можете купить красивые сувениры на память об этих сказочных и неповторимых днях отдыха.","tv":"Trong những cửa hàng giá rẻ của thị trấn chúng tôi, quý khách có thể mua những món quà lưu niệm đẹp để ghi nhớ những ngày nghỉ tuyệt vời và độc đáo này.","s":1,"n":67},{"q":"Кто посоветовал ему поступить в медицинский институт?","qv":"Ai khuyên ông ấy vào trường y?","a":"Родители.","av":"Bố mẹ.","t":"Родителям мальчика нравилась медицина, поэтому они хотели, чтобы их сын стал врачом. По совету родителей Александр поступил в медицинский институт.","tv":"Bố mẹ cậu bé yêu thích ngành y nên muốn con trai trở thành bác sĩ. Theo lời khuyên của bố mẹ, Aleksandr đã vào trường y.","s":1,"n":68},{"q":"Что предложили Лене делать?","qv":"Người ta đã đề nghị Lena làm gì?","a":"Сниматься в фильме.","av":"Đóng phim.","t":"Недавно её пригласили сниматься в фильме. Роль небольшая. И она согласилась.","tv":"Gần đây, cô ấy được mời đóng phim. Vai diễn nhỏ thôi, và cô ấy đã đồng ý.","s":1,"n":69},{"q":"На кого похож его брат?","qv":"Anh trai của người kể chuyện giống ai?","a":"На отца.","av":"Giống bố.","t":"Моего старшего брата зовут Антон. Вот он, справа. Антон очень похож на нашего отца. У него такая же приятная улыбка, как у папы, и карие глаза. Сейчас Антон работает дизайнером, хотя он всегда мечтал быть художником. Я думаю, что у него действительно есть талант. Он очень любит рисовать портреты и пейзажи. Антон одевается очень экстравагантно, как настоящий человек искусства.","tv":"Anh trai tôi tên là Anton. Anh ở bên phải. Anton rất giống bố chúng tôi. Anh có nụ cười dễ mến như bố và đôi mắt nâu. Hiện nay Anton làm nhà thiết kế, mặc dù anh luôn mơ trở thành họa sĩ. Tôi nghĩ anh thực sự có tài năng. Anh rất thích vẽ chân dung và phong cảnh. Anton ăn mặc rất độc đáo, như một người làm nghệ thuật thực thụ.","s":1,"n":70},{"q":"Где находится кафе, которое называется «Столовая № 57»?","qv":"Quán ăn tên là Stolovaya số 57 nằm ở đâu?","a":"На третьем этаже ГУМа.","av":"Ở tầng ba GUM.","t":"В магазине ГУМ 3 этажа. После перестройки на 3-м этаже ГУМа открыли интересное кафе, которое называется «Столовая № 57».","tv":"Cửa hàng GUM có ba tầng. Sau thời kỳ cải tổ, một quán ăn thú vị tên là Stolovaya số 57 được mở ở tầng ba GUM.","s":1,"n":71},{"q":"В каком году Моцарт переехал в Вену?","qv":"Mozart chuyển đến Vienna vào năm nào?","a":"В 1781 году.","av":"Năm 1781.","t":"В 1781 году Моцарт переехал в Вену.","tv":"Năm 1781, Mozart chuyển đến Vienna.","s":1,"n":72},{"q":"Сколько времени в день он играл на музыкальных инструментах?","qv":"Mỗi ngày ông ấy chơi nhạc cụ trong bao lâu?","a":"Шесть часов в день.","av":"Sáu giờ mỗi ngày.","t":"В консерватории ученики 6 часов в день играли на музыкальных инструментах и часто ходили в филармонию и оперный театр.","tv":"Ở nhạc viện, học viên chơi nhạc cụ sáu giờ mỗi ngày và thường đến nhà hát giao hưởng và nhà hát opera.","s":1,"n":73},{"q":"Когда она начала преподавать английский язык?","qv":"Cô ấy bắt đầu dạy tiếng Anh khi nào?","a":"В 1991 году, после университета.","av":"Năm 1991, sau khi tốt nghiệp đại học.","t":"После университета в 1991 году, когда девушке было 26 лет, она поехала в Португалию преподавать английский.","tv":"Sau khi tốt nghiệp đại học, vào năm 1991, khi 26 tuổi, cô ấy đến Bồ Đào Nha dạy tiếng Anh.","s":1,"n":74},{"q":"Что есть и чего нет в Москве?","qv":"Moskva có những gì và không có những gì?","a":"Есть холмы, реки, леса и парки; нет гор, водопадов, озёр и морей.","av":"Có đồi, sông, rừng và công viên; không có núi, thác nước, hồ và biển.","t":"В Москве несколько холмов, 8 рек, 40 лесов, 131 парк, но нет гор, водопадов, озер и морей.","tv":"Ở Moskva có một số ngọn đồi, 8 con sông, 40 khu rừng và 131 công viên, nhưng không có núi, thác nước, hồ và biển.","s":1,"n":75},{"q":"Что они делали на следующий день?","qv":"Ngày hôm sau họ đã làm gì?","a":"Готовили вьетнамскую еду дома.","av":"Nấu món ăn Việt Nam ở nhà.","t":"На следующий день мы сами готовили вьетнамскую еду дома.","tv":"Ngày hôm sau, chúng tôi tự nấu món ăn Việt Nam ở nhà.","s":1,"n":76},{"q":"Почему автор сказал, что их поездка была не очень удачной?","qv":"Vì sao tác giả nói chuyến đi của họ không được thành công lắm?","a":"Подруга потеряла фотоаппарат.","av":"Bạn gái làm mất máy ảnh.","t":"А в последний день отпуска моя подруга потеряла фотоаппарат. К сожалению, наша поездка в Исландию была не очень удачной.","tv":"Vào ngày cuối cùng của kỳ nghỉ, bạn gái tôi làm mất máy ảnh. Tiếc là chuyến đi Iceland của chúng tôi không được thành công lắm.","s":1,"n":77},{"q":"Что они не взяли с собой?","qv":"Họ đã không mang theo thứ gì?","a":"Тёплую одежду.","av":"Quần áo ấm.","t":"На улице было очень холодно, а мы не взяли с собой теплую одежду.","tv":"Ngoài trời rất lạnh mà chúng tôi lại không mang theo quần áo ấm.","s":1,"n":78},{"q":"От кого Арнольд получил электронное письмо?","qv":"Arnold nhận được email từ ai?","a":"От мамы.","av":"Từ mẹ.","t":"Но через три дня Арнольд получил электронное письмо от мамы.","tv":"Nhưng ba ngày sau, Arnold nhận được một email từ mẹ.","s":1,"n":79},{"q":"В каком месяце он хочет работать в газете?","qv":"Anh ấy muốn làm việc ở tòa soạn báo vào tháng nào?","a":"В июле.","av":"Vào tháng Bảy.","t":"В июле Питер хочет работать в какой-нибудь газете.","tv":"Vào tháng Bảy, Peter muốn làm việc ở một tòa soạn báo nào đó.","s":2,"n":1},{"q":"Где он хочет побывать во время каникул?","qv":"Anh ấy muốn đến đâu trong kỳ nghỉ?","a":"В местах, где жил Пушкин.","av":"Những nơi Pushkin từng sống.","t":"В турагентстве. Здравствуйте. Добрый день, слушаю вас. Я хотел бы поехать на экскурсию.","tv":"Tại công ty du lịch. Xin chào. Chào ông, tôi đang nghe đây. Tôi muốn đi tham quan.","s":2,"n":2},{"q":"Какое место проживания Нина решила снять?","qv":"Nina quyết định thuê chỗ ở như thế nào?","a":"Маленькую удобную однокомнатную квартиру.","av":"Một căn hộ nhỏ, tiện nghi, có một phòng.","t":"На второй год я переехала из общежития. Я сняла маленькую квартиру. Однокомнатную. Маленькую, но очень удобную.","tv":"Năm thứ hai, tôi chuyển khỏi ký túc xá. Tôi thuê một căn hộ nhỏ, có một phòng. Căn hộ nhỏ nhưng rất tiện nghi.","s":2,"n":3},{"q":"В каком году родилась бабушка?","qv":"Bà sinh năm nào?","a":"В 1937 году.","av":"Năm 1937.","t":"Бабушка родилась в 1937 году.","tv":"Bà sinh năm 1937.","s":2,"n":4},{"q":"Что они делали во время отдыха?","qv":"Họ đã làm gì trong kỳ nghỉ?","a":"Гуляли, посещали музеи, катались на лодке.","av":"Đi dạo, thăm bảo tàng và đi thuyền.","t":"Мы весь день гуляли по городу, посещали музеи, катались по каналам на лодке.","tv":"Cả ngày chúng tôi đi dạo trong thành phố, thăm các bảo tàng và đi thuyền trên các kênh.","s":2,"n":5},{"q":"С какой целью она поехала в Португалию?","qv":"Cô ấy đến Bồ Đào Nha với mục đích gì?","a":"Преподавать английский язык.","av":"Để dạy tiếng Anh.","t":"После университета в 1991 году, когда девушке было 26 лет, она поехала в Португалию преподавать английский.","tv":"Sau khi tốt nghiệp đại học, vào năm 1991, khi 26 tuổi, cô ấy đến Bồ Đào Nha dạy tiếng Anh.","s":2,"n":6},{"q":"Кем она работает в школе?","qv":"Cô ấy làm nghề gì ở trường?","a":"Учителем.","av":"Giáo viên.","t":"Я работаю учителем в школе.","tv":"Tôi làm giáo viên ở trường.","s":2,"n":7},{"q":"Почему Алёна хорошо знает Звенигород?","qv":"Vì sao Alyona biết rõ Zvenigorod?","a":"Она отдыхала там с родителями.","av":"Cô ấy từng nghỉ ở đó cùng bố mẹ.","t":"А ты уже была там когда-нибудь? Да, была. Я несколько раз отдыхала в Звенигороде с родителями во время зимних каникул.","tv":"Cậu đã đến đó bao giờ chưa? Rồi. Tớ đã vài lần nghỉ ở Zvenigorod cùng bố mẹ trong kỳ nghỉ đông.","s":2,"n":8},{"q":"Где родилась Мария?","qv":"Maria sinh ra ở đâu?","a":"В селе на севере России.","av":"Trong một ngôi làng ở miền Bắc nước Nga.","t":"Мария родилась в небольшом селе на севере России.","tv":"Maria sinh ra trong một ngôi làng nhỏ ở miền Bắc nước Nga.","s":2,"n":9},{"q":"Сколько стоит эта экскурсия?","qv":"Chuyến tham quan này giá bao nhiêu?","a":"2000 рублей.","av":"2.000 rúp.","t":"Скажите, пожалуйста, сколько стоит эта поездка? Недорого. Две тысячи рублей. Извините. Две тысячи рублей за всё? И за билеты? И за гостиницу? И за экскурсии? Да. Это всё входит в стоимость тура.","tv":"Xin cho biết chuyến đi này giá bao nhiêu? Không đắt, 2.000 rúp. Xin lỗi, 2.000 rúp cho tất cả sao? Cả vé, khách sạn và các chuyến tham quan? Đúng vậy, tất cả đều nằm trong giá tour.","s":2,"n":10},{"q":"Где он живёт? Где находится его деревня?","qv":"Ông ấy sống ở đâu? Ngôi làng của ông ấy nằm ở đâu?","a":"В деревне недалеко от города.","av":"Trong một ngôi làng gần thành phố.","t":"Я живу в большом доме, в деревне. Мне очень нравится здесь жить. В нашей деревне есть всё для комфортной жизни, и она находится недалеко от города.","tv":"Tôi sống trong một ngôi nhà lớn ở làng. Tôi rất thích sống ở đây. Làng chúng tôi có mọi thứ cần thiết để sống thoải mái và nằm gần thành phố.","s":2,"n":11},{"q":"Что он увидит в первый день?","qv":"Ngày đầu tiên anh ấy sẽ nhìn thấy gì?","a":"Псков и Псковский Кремль.","av":"Pskov và điện Kremlin Pskov.","t":"В первый день вы побываете в Пскове. Посмотрите знаменитый Псковский Кремль.","tv":"Ngày đầu tiên, quý khách đến Pskov và xem điện Kremlin Pskov nổi tiếng.","s":2,"n":12},{"q":"Сколько времени Дмитрий занимался футболом?","qv":"Dmitry đã chơi bóng đá trong bao lâu?","a":"Более восьми лет.","av":"Hơn tám năm.","t":"Дмитрий рассказал Александру, что раньше более 8 лет он занимался футболом.","tv":"Dmitry kể với Aleksandr rằng trước đây anh đã chơi bóng đá hơn tám năm.","s":2,"n":13},{"q":"Куда продолжала ездить бабушка после смерти дедушки?","qv":"Sau khi ông mất bà vẫn tiếp tục đi đâu?","a":"На север.","av":"Đến miền Bắc.","t":"Во время отпуска бабушка с дедушкой ездили на север и жили высоко в горах. Потом дедушка умер, но бабушка продолжала каждое лето ездить туда.","tv":"Trong kỳ nghỉ, ông bà đến miền Bắc và ở trên núi cao. Sau đó ông mất, nhưng bà vẫn tiếp tục đến đó vào mỗi mùa hè.","s":2,"n":14},{"q":"Почему первый урок для неё самый трудный?","qv":"Vì sao tiết học đầu tiên là tiết khó nhất đối với cô ấy?","a":"Утром дети хотят спать.","av":"Buổi sáng trẻ em muốn ngủ.","t":"Первый урок самый трудный для меня, потому что рано утром все дети хотят спать и время идет очень медленно.","tv":"Tiết học đầu tiên là tiết khó nhất đối với tôi, vì sáng sớm tất cả trẻ em đều muốn ngủ và thời gian trôi rất chậm.","s":2,"n":15},{"q":"Зачем Майкл хотел найти Алёну?","qv":"Vì sao Michael muốn tìm Alyona?","a":"Посоветоваться с ней.","av":"Để hỏi ý kiến cô ấy.","t":"Привет, Алёна. Наконец-то я тебя нашёл. Мне надо с тобой посоветоваться.","tv":"Chào Alyona. Cuối cùng tớ cũng tìm được cậu. Tớ cần hỏi ý kiến cậu.","s":2,"n":16},{"q":"В какое время они поехали в Амстердам?","qv":"Họ đến Amsterdam vào thời gian nào?","a":"На выходные, когда были студентами.","av":"Vào cuối tuần, khi còn là sinh viên.","t":"Когда мы с Беном были студентами, мы поехали на выходные в Амстердам.","tv":"Khi tôi và Ben còn là sinh viên, chúng tôi đã đến Amsterdam vào cuối tuần.","s":2,"n":17},{"q":"С кем поедет Майкл на экскурсию в Звенигород?","qv":"Michael sẽ đi tham quan Zvenigorod cùng ai?","a":"Со своими друзьями.","av":"Với các bạn của anh ấy.","t":"А почему ты спрашиваешь? Мои друзья предложили мне поехать туда на экскурсию в субботу.","tv":"Vì sao cậu hỏi? Các bạn của tớ rủ tớ đến đó tham quan vào thứ Bảy.","s":2,"n":18},{"q":"Какая у него температура?","qv":"Anh ấy sốt bao nhiêu độ?","a":"37,7 °C.","av":"37,7 độ C.","t":"У него есть температура? Спрашивает врач. Да, 37,7. Отвечает мама.","tv":"Cậu ấy có sốt không? Bác sĩ hỏi. Có, 37,7 độ. Mẹ trả lời.","s":2,"n":19},{"q":"Какой институт бабушка окончила?","qv":"Bà đã tốt nghiệp trường nào?","a":"Медицинский институт.","av":"Trường y.","t":"Поэтому она закончила медицинский институт и стала спортивным врачом.","tv":"Vì thế bà đã tốt nghiệp trường y và trở thành bác sĩ thể thao.","s":2,"n":20},{"q":"С кем Нина живёт в комнате?","qv":"Nina sống cùng ai trong phòng?","a":"С тремя девушками.","av":"Với ba cô gái.","t":"Со мной в комнате жили еще три девушки.","tv":"Trong phòng còn có ba cô gái khác sống cùng tôi.","s":2,"n":21},{"q":"Когда основали Звенигород?","qv":"Zvenigorod được thành lập khi nào?","a":"800 лет назад, в XII веке.","av":"800 năm trước, vào thế kỷ XII.","t":"Звенигород старый и очень симпатичный город. Он появился 800 лет назад в 12 веке. 800 лет назад? Какой старый город?","tv":"Zvenigorod là một thành phố cổ và rất đẹp. Thành phố xuất hiện 800 năm trước, vào thế kỷ XII. 800 năm trước sao? Thành phố thật cổ!","s":2,"n":22},{"q":"Во сколько её рабочий день заканчивается?","qv":"Ngày làm việc của cô ấy kết thúc lúc mấy giờ?","a":"В три часа дня.","av":"Lúc 3 giờ chiều.","t":"Обычно мой рабочий день заканчивается в 3 часа.","tv":"Thông thường ngày làm việc của tôi kết thúc lúc 3 giờ.","s":2,"n":23},{"q":"Когда он решил переехать в деревню?","qv":"Ông ấy quyết định chuyển về làng khi nào?","a":"Когда женился.","av":"Khi kết hôn.","t":"Когда я женился, мы с женой решили переехать в деревню и построить там свой дом.","tv":"Khi tôi kết hôn, tôi và vợ quyết định chuyển về làng và xây nhà riêng ở đó.","s":2,"n":24},{"q":"На каком факультете училась Мария?","qv":"Maria học ở khoa nào?","a":"На юридическом факультете.","av":"Ở khoa Luật.","t":"Мария училась на юриста.","tv":"Maria học để trở thành luật sư.","s":2,"n":25},{"q":"Что любила бабушка всю жизнь?","qv":"Suốt đời bà yêu thích điều gì?","a":"Рискованные путешествия.","av":"Những chuyến du lịch mạo hiểm.","t":"Всю жизнь бабушка очень любила рискованные путешествия.","tv":"Suốt đời bà rất yêu thích những chuyến du lịch mạo hiểm.","s":2,"n":26},{"q":"Когда он переехал в другую квартиру?","qv":"Ông ấy chuyển sang căn hộ khác khi nào?","a":"После университета, когда устроился на первую работу.","av":"Sau khi tốt nghiệp đại học và có công việc đầu tiên.","t":"Когда я окончил университет и устроился на первую работу, я переехал в другую квартиру.","tv":"Khi tốt nghiệp đại học và có công việc đầu tiên, tôi chuyển sang một căn hộ khác.","s":2,"n":27},{"q":"О чём друзья говорили, когда они гуляли?","qv":"Khi đi dạo những người bạn đã nói về chuyện gì?","a":"О любимых видах спорта.","av":"Về những môn thể thao yêu thích.","t":"Во время прогулки они начали говорить о том, какой вид спорта каждому из них нравится.","tv":"Trong lúc đi dạo, họ bắt đầu nói về môn thể thao mà mỗi người yêu thích.","s":2,"n":28},{"q":"Что врач сказал после осмотра?","qv":"Bác sĩ nói gì sau khi khám?","a":"Он думает, что это грипп.","av":"Bác sĩ nghĩ đó là bệnh cúm.","t":"Я думаю, что это грипп. Сейчас все болеют. Говорит врач и пишет рецепт.","tv":"Tôi nghĩ đây là bệnh cúm. Bây giờ ai cũng đang bị bệnh. Bác sĩ nói rồi viết đơn thuốc.","s":2,"n":29},{"q":"В каком месте учёбы учится Питер?","qv":"Peter học ở đâu?","a":"В университете.","av":"Ở đại học.","t":"Питер учится в университете.","tv":"Peter học ở đại học.","s":2,"n":30},{"q":"В каком доме жили дедушка и бабушка на севере?","qv":"Ông bà đã ở trong ngôi nhà như thế nào ở miền Bắc?","a":"В маленьком лесном домике.","av":"Trong một căn nhà nhỏ trong rừng.","t":"Они жили там всё лето в маленьком лесном домике.","tv":"Họ ở đó suốt mùa hè, trong một căn nhà nhỏ trong rừng.","s":2,"n":31},{"q":"Какие условия в хостеле?","qv":"Điều kiện ở nhà trọ như thế nào?","a":"Грязная холодная комната, шумные соседи.","av":"Phòng bẩn và lạnh, hàng xóm ồn ào.","t":"Когда мы приехали в хостел, мы были в шоке. Комната была очень грязная и холодная, а соседи шумные.","tv":"Khi đến nhà trọ, chúng tôi bị sốc. Phòng rất bẩn và lạnh, còn những người ở cạnh thì ồn ào.","s":2,"n":32},{"q":"Где находится Звенигород?","qv":"Zvenigorod nằm ở đâu?","a":"Недалеко от Москвы.","av":"Gần Moskva.","t":"Что ты знаешь о городе Звенигороде? Ну, знаю немного. Это небольшой, очень красивый город. Он находится совсем недалеко от Москвы.","tv":"Cậu biết gì về thành phố Zvenigorod? Tớ biết một chút. Đó là một thành phố nhỏ, rất đẹp, nằm gần Moskva.","s":2,"n":33},{"q":"Кто его подруга?","qv":"Bạn gái của anh ấy là ai?","a":"Русская девушка.","av":"Một cô gái Nga.","t":"И есть любимая русская девушка.","tv":"Và anh ấy có một cô gái Nga mà mình yêu.","s":2,"n":34},{"q":"Почему Нина решила больше не жить в общежитии?","qv":"Vì sao Nina quyết định không sống trong ký túc xá nữa?","a":"Жить вчетвером было трудно.","av":"Sống bốn người cùng phòng rất khó.","t":"Жить вместе было очень трудно. Комната большая. Она хоть и большая, но жить вчетвером вместе очень тяжело. Представляете? Одна хочет заниматься, другая музыку слушать. А если я хочу спать? Что делать? Нет, такая жизнь не для меня. Конечно, университет рядом рукой подать. Это здорово. Но жить вместе вчетвером нет сил.","tv":"Sống cùng nhau rất khó. Phòng lớn, nhưng dù phòng lớn thì sống bốn người cùng nhau vẫn rất vất vả. Các bạn hình dung nhé: một người muốn học, một người muốn nghe nhạc. Còn nếu tôi muốn ngủ thì sao? Phải làm gì? Không, cuộc sống như vậy không hợp với tôi! Dĩ nhiên đại học ở rất gần, điều đó thật tốt. Nhưng tôi không chịu nổi việc sống bốn người cùng phòng nữa.","s":2,"n":35},{"q":"Где они остановились для отдыха?","qv":"Họ dừng lại nghỉ ở đâu?","a":"В дешёвом хостеле.","av":"Ở một nhà trọ giá rẻ.","t":"Мы остановились в дешевом хостеле, чтобы сэкономить.","tv":"Chúng tôi ở một nhà trọ giá rẻ để tiết kiệm tiền.","s":2,"n":36},{"q":"Что она любила в школе?","qv":"Ở trường cô ấy thích điều gì?","a":"Английский язык.","av":"Tiếng Anh.","t":"В школе девочка любила английский и интересовалась иностранными языками.","tv":"Ở trường, cô bé thích tiếng Anh và quan tâm đến các ngoại ngữ.","s":2,"n":37},{"q":"Что Мише надо делать дома, чтобы выздороветь?","qv":"Misha cần làm gì ở nhà để khỏi bệnh?","a":"Принимать лекарство три раза в день, много пить и отдыхать.","av":"Uống thuốc ba lần mỗi ngày, uống nhiều nước và nghỉ ngơi.","t":"Миша должен принимать это лекарство три раза в день, утром, днем и вечером. А еще он должен много пить и отдыхать.","tv":"Misha phải uống thuốc này ba lần mỗi ngày: sáng, trưa và tối. Cậu còn phải uống nhiều nước và nghỉ ngơi.","s":2,"n":38},{"q":"С кем Александр любил смотреть хоккей?","qv":"Aleksandr thích xem khúc côn cầu cùng ai?","a":"С дедушкой.","av":"Với ông.","t":"Он ответил, что в детстве любил смотреть хоккей вместе с дедушкой.","tv":"Anh ấy trả lời rằng hồi nhỏ thích xem khúc côn cầu cùng ông.","s":2,"n":39},{"q":"Почему ему было неудобно жить в квартире?","qv":"Vì sao ông ấy cảm thấy bất tiện khi sống trong căn hộ?","a":"В квартире было мало места.","av":"Căn hộ quá chật.","t":"В моей квартире было очень мало места, и из-за этого в ней было не очень удобно жить.","tv":"Căn hộ của tôi có rất ít không gian nên sống trong đó không được thuận tiện lắm.","s":2,"n":40},{"q":"Где она обычно остаётся после уроков?","qv":"Sau giờ học cô ấy thường ở lại đâu?","a":"В классе.","av":"Trong lớp học.","t":"После уроков я обычно остаюсь в классе и проверяю тетради.","tv":"Sau giờ học, tôi thường ở lại lớp và chấm vở.","s":2,"n":41},{"q":"Почему Мария сильно уставала каждый день?","qv":"Vì sao ngày nào Maria cũng rất mệt?","a":"Каждый день делала домашние задания.","av":"Ngày nào cũng phải làm bài tập về nhà.","t":"Но она очень сильно уставала, потому что каждый день ей нужно было делать домашние задания.","tv":"Nhưng cô ấy rất mệt vì ngày nào cũng phải làm bài tập về nhà.","s":2,"n":42},{"q":"Во сколько начинается её рабочий день?","qv":"Ngày làm việc của cô ấy bắt đầu lúc mấy giờ?","a":"В восемь часов.","av":"Lúc 8 giờ.","t":"Мой рабочий день начинается в 8 часов.","tv":"Ngày làm việc của tôi bắt đầu lúc 8 giờ.","s":2,"n":43},{"q":"Кем она подрабатывала?","qv":"Cô ấy làm thêm nghề gì?","a":"Официанткой в кафе.","av":"Nhân viên phục vụ ở quán cà phê.","t":"Помимо учебы, Мария подрабатывала официан
